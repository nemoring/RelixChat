appId: app.noteforge.editor
productName: NoteForge
copyright: Copyright © NoteForge
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
publish: null
fileAssociations:
  - ext: nfg
    name: NoteForge Project
    description: NoteForge score project
    role: Editor
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: NoteForge-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NoteForge
linux:
  target: [AppImage]
  category: Audio
