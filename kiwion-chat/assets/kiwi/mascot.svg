      <circle cx="84" cy="66" r="14"/><circle cx="106" cy="62" r="14"/><circle cx="40" cy="132" r="13"/>
      <circle cx="48" cy="150" r="13"/><circle cx="66" cy="162" r="13"/><circle cx="90" cy="168" r="13"/>
      <circle cx="116" cy="166" r="13"/><circle cx="138" cy="156" r="13"/>
