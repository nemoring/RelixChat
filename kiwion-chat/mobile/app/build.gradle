plugins {
    id "com.android.application"
}

// The app talks ONLY to this server; it is fixed at build time and cannot be changed in the app.
def kiwionServer = (System.getenv("KIWION_SERVER_URL") ?: "").replaceAll('/+$', '')
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains("release") } && !kiwionServer.startsWith("https://")) {
        throw new GradleException("Release build: set KIWION_SERVER_URL=https://your-domain (the only server the app will use)")
    }
}

android {
    namespace "dev.kiwifuzzy.kiwion"
    compileSdk 34

    defaultConfig {
        applicationId "dev.kiwifuzzy.kiwion"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        if (kiwionServer) resValue "string", "kiwion_server_url", kiwionServer
    }

    signingConfigs {
        release {
            if (System.getenv("KIWION_KEYSTORE")) {
                storeFile file(System.getenv("KIWION_KEYSTORE"))
                storePassword System.getenv("KIWION_KEYSTORE_PASS")
                keyAlias System.getenv("KIWION_KEY_ALIAS") ?: "kiwion"
                keyPassword System.getenv("KIWION_KEYSTORE_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KIWION_KEYSTORE")) signingConfig signingConfigs.release
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // live UI tests talk to a running Kiwion backend (see run_ui_tests.sh)
                systemProperty "kiwion.testServer", System.getenv("KIWION_TEST_SERVER") ?: ""
                testLogging { events "passed", "skipped", "failed"; exceptionFormat "full" }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// The app itself uses only the Android framework; these are test-only dependencies.
dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.13"
}
