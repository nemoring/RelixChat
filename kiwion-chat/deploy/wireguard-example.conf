# Example WireGuard tunnel between the VPS (10.8.0.1) and the home inference PC (10.8.0.2).
# The home PC connects OUT to the VPS, so no port forwarding on the home router is needed.
#
# --- /etc/wireguard/wg0.conf on the VPS ---
# [Interface]
# Address = 10.8.0.1/24
# ListenPort = 51820
# PrivateKey = <vps-private-key>          # wg genkey | tee vps.key | wg pubkey > vps.pub
#
# [Peer]   # home inference PC
# PublicKey = <home-public-key>
# AllowedIPs = 10.8.0.2/32
#
# --- /etc/wireguard/wg0.conf on the home PC ---
# [Interface]
# Address = 10.8.0.2/24
# PrivateKey = <home-private-key>
#
# [Peer]   # VPS
# PublicKey = <vps-public-key>
# Endpoint = <vps-public-ip>:51820
# AllowedIPs = 10.8.0.1/32
# PersistentKeepalive = 25
#
# Then on the home PC:  KIWION_INFERENCE_HOST=10.8.0.2   (listen only on the tunnel)
# and on the VPS:       KIWION_INFERENCE_URL=http://10.8.0.2:8090
# Requests are additionally HMAC-signed with KIWION_INFERENCE_SECRET; add mTLS with scripts/gen_certs.sh if you like.
