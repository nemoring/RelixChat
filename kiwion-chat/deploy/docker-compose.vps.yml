# VPS: backend API + web + admin behind Caddy (automatic HTTPS via Let's Encrypt).
#
# Two modes:
#  * model on a home PC (WireGuard/mTLS):  KIWION_INFERENCE_URL=http://10.8.0.2:8090
#      docker compose -f deploy/docker-compose.vps.yml up -d --build
#  * everything on this VPS (profile "model"): KIWION_INFERENCE_URL=http://inference:8090, GGUF in ./models
#      docker compose -f deploy/docker-compose.vps.yml --profile model up -d --build
#    The inference container is reachable only on the internal Docker network (no published port).
services:
  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    env_file: ../.env
    environment:
      KIWION_ENV: production
      KIWION_HTTPS: "1"
      KIWION_DATABASE_URL: ${KIWION_DATABASE_URL:-sqlite:////app/data/kiwion.db}
    volumes:
      - kiwion-data:/app/data
      - ./certs:/app/certs:ro          # optional mTLS client certs for the inference node
    restart: unless-stopped
    mem_limit: 512m
  inference:
    profiles: ["model"]
    build: { context: .., dockerfile: deploy/Dockerfile.inference }
    env_file: ../.env
    environment:
      KIWION_INFERENCE_HOST: 0.0.0.0          # internal network only, see "ports" (none)
      KIWION_MODEL_PATH: /models/${KIWION_MODEL_FILE:-olmo-2-1b-instruct-Q4_K_M.gguf}
    volumes:
      - ../models:/models:ro
    restart: unless-stopped
    mem_limit: ${KIWION_INFERENCE_MEM_LIMIT:-3g}
  caddy:
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    environment:
      KIWION_DOMAIN: ${KIWION_DOMAIN:?set KIWION_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [backend]
    restart: unless-stopped
volumes:
  kiwion-data:
  caddy-data:
