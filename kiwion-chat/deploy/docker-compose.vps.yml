# VPS: backend API + web + admin behind Caddy (automatic HTTPS via Let's Encrypt).
# The inference node runs elsewhere (home PC) and is reached via WireGuard or mTLS.
#   cp .env.example .env   # fill in secrets, KIWION_DOMAIN, KIWION_INFERENCE_URL
#   docker compose -f deploy/docker-compose.vps.yml up -d --build
services:
  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    env_file: ../.env
    environment:
      KIWION_ENV: production
      KIWION_HTTPS: "1"
      KIWION_DATABASE_URL: ${KIWION_DATABASE_URL:-sqlite:////app/data/kiwion.db}
    volumes:
      - kiwion-data:/app/data
      - ./certs:/app/certs:ro          # optional mTLS client certs for the inference node
    restart: unless-stopped
    mem_limit: 512m
  caddy:
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    environment:
      KIWION_DOMAIN: ${KIWION_DOMAIN:?set KIWION_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [backend]
    restart: unless-stopped
volumes:
  kiwion-data:
  caddy-data:
